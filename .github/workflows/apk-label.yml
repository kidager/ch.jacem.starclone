name: APK (label)

# The apk-debug and apk-release labels build that APK from the PR and link it in a PR comment.
# New pushes don't rebuild: remove the label and add it again.
on:
  pull_request:
    types: [labeled]

# Per label: both APKs can build at the same time, a newer build of the same one cancels the older
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    if: github.event.label.name == 'apk-debug' || github.event.label.name == 'apk-release'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # kidager[bot] token for the download link comment
      id-token: write
    env:
      VARIANT: ${{ github.event.label.name == 'apk-release' && 'release' || 'debug' }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: ./.github/actions/rclone
        id: rclone

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Decode upload keystore
        if: env.VARIANT == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks

      # The rs flavor's universal APK (all ABIs in one)
      - name: Build the APK
        id: build
        env:
          KEY_ALIAS: ${{ vars.KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SKIP_RCLONE: ${{ steps.rclone.outputs.cache-hit == 'true' && '-x :rclone:buildAll' || '' }}
        run: |
          ./gradlew "assembleRs${VARIANT^}" $SKIP_RCLONE
          # Uploaded unzipped, so the file name is the download name
          apk="starclone-pr${PR}-${VARIANT}-${HEAD_SHA::7}.apk"
          mv app/build/outputs/apk/rs/${VARIANT}/*-universal-${VARIANT}.apk "$apk"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          path: ${{ steps.build.outputs.apk }}
          archive: false
          retention-days: 7
          if-no-files-found: error

      # Comments go out as kidager[bot]
      - id: bot
        uses: kidager/actions/token@51640e6ee365e87a4b78b555dcaf6a0c5183e8a9 # v1.0.0

      # One comment per variant, updated by each new build
      - name: Link the APK on the PR
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          APK: ${{ steps.build.outputs.apk }}
          URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          marker="<!-- apk-${VARIANT} -->"
          expires=$(date -u -d '+7 days' +%Y-%m-%d)
          body="${marker}
          📦 **${VARIANT^} APK** of ${HEAD_SHA::7}: [${APK}](${URL})
          Available until ${expires}. Remove and add the \`apk-${VARIANT}\` label again to build a newer commit."
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.user.login == \"kidager[bot]\" and (.body | startswith(\"${marker}\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" > /dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" > /dev/null
          fi
