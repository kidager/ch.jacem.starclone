name: CI

on:
  pull_request:
    branches: [main]
  # setup-gradle and the rclone cache are only shared from the default branch: these runs fill them for every PR
  push:
    branches: [main]

# One run per PR: a newer push cancels the running one. Several merges to main in a row update the
# release PR each time, so only the build of its latest state keeps running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every PR: lint, unit tests, notes scripts (no rclone needed)
  checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Lint
        run: ./gradlew lint -x :rclone:buildAll

      - name: Test
        run: ./gradlew testRsDebugUnitTest -x :rclone:buildAll

      - name: Test Play Store release notes scripts
        run: .github/scripts/test-play-notes.sh

  # Main only: builds the rclone libraries once per rclone/Go/NDK version, so PR builds find them in the cache
  rclone-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rclone
        id: rclone

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.rclone.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.rclone.outputs.cache-hit != 'true'

      - name: Build rclone
        if: steps.rclone.outputs.cache-hit != 'true'
        run: ./gradlew :rclone:buildAll

  # Release PR only: what release.yml publishes when the release is created. Play gets the rs AAB,
  # the GitHub release the universal APKs of both flavors.
  release-build:
    if: github.head_ref == 'release-please--branches--main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: ./.github/actions/rclone
        id: rclone

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks

      - name: Build the rs AAB and the APKs of both flavors
        env:
          KEY_ALIAS: ${{ vars.KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SKIP_RCLONE: ${{ steps.rclone.outputs.cache-hit == 'true' && '-x :rclone:buildAll' || '' }}
        run: ./gradlew bundleRsRelease assembleRsRelease assembleOssRelease $SKIP_RCLONE

      # Picked up by release.yml when this exact code is released, then deleted
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build
          path: |
            app/build/outputs/bundle/rsRelease/*.aab
            app/build/outputs/apk/rs/release/*-universal-release.apk
            app/build/outputs/apk/oss/release/*-universal-release.apk
          retention-days: 14
          if-no-files-found: error
