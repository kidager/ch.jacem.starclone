name: Android Lint

on:
  push:
  pull_request:
    branches-ignore:
      - 'master'

# A newer push to the same branch or PR replaces the running check
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkLint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Run Linter
        run: ./gradlew lint -x :rclone:buildAll
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Lint Reports
          path: ~/**/build/reports/
          retention-days: 30
