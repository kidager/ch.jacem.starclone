name: Release build (release PR)

# The signed build of the release PR, once it's ready to merge: add the build label (a refresh after that builds it
# again, the label stays). release.yml publishes this build when the release is created.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# A newer push or label event replaces the running one: its labels are the current ones, so the gate stays right
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.head_ref == 'release-please--branches--main' && contains(github.event.pull_request.labels.*.name, 'build')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: ./.github/actions/rclone
        id: rclone

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks

      - name: Build the rs AAB and the APKs of both flavors
        env:
          KEY_ALIAS: ${{ vars.KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SKIP_RCLONE: ${{ steps.rclone.outputs.cache-hit == 'true' && '-x :rclone:buildAll' || '' }}
        run: ./gradlew bundleRsRelease assembleRsRelease assembleOssRelease $SKIP_RCLONE

      # Picked up by release.yml when this exact code is released, then deleted
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build
          path: |
            app/build/outputs/bundle/rsRelease/*.aab
            app/build/outputs/apk/rs/release/*-universal-release.apk
            app/build/outputs/apk/oss/release/*-universal-release.apk
          retention-days: 14
          if-no-files-found: error

  # Required check: skipped on other PRs (counts as passed), blocks the release PR until the build ran and passed
  release-build:
    needs: build
    if: always() && github.head_ref == 'release-please--branches--main'
    runs-on: ubuntu-26.04
    steps:
      - name: Check the release build
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          echo "release build: $RESULT"
          [ "$RESULT" = success ] && exit 0
          [ "$RESULT" = skipped ] && echo "::error::Add the build label to build the release before merging the release PR"
          exit 1
