name: Release

on:
  # The release PR and the releases come from kidager-bot (GitHub App)
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]

# A newer update of a PR replaces the running one; releases always run to the end
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Editable Play Store notes live in a comment on the release PR, used when it is merged.
  # First the changelog sections right away, then gemini-notes below replaces them or says why not.
  release-notes:
    if: github.event_name == 'pull_request' && github.head_ref == 'release-please--branches--main'
    runs-on: ubuntu-26.04
    # Shared with gemini-notes: a newer update cancels the previous Gemini call, so stale notes never land
    concurrency:
      group: play-notes-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      # kidager[bot] token for the notes comment
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Comments go out as kidager[bot]
      - id: bot
        uses: kidager/actions/token@51640e6ee365e87a4b78b555dcaf6a0c5183e8a9 # v1.0.0

      - name: Sync Play Store release notes comment
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: .github/scripts/play-notes.sh sync "$PR"

  # Customer-facing notes written by Gemini, on their own: nothing waits for them and a failure
  # only shows its reason in the notes comment
  gemini-notes:
    needs: release-notes
    runs-on: ubuntu-26.04
    # Up to 3 Gemini attempts of 2 minutes, with 30 s between them
    timeout-minutes: 10
    concurrency:
      group: play-notes-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Comments go out as kidager[bot]
      - id: bot
        uses: kidager/actions/token@51640e6ee365e87a4b78b555dcaf6a0c5183e8a9 # v1.0.0

      - name: Write the notes with Gemini
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: .github/scripts/play-notes.sh ai "$PR"

  # Every release goes to Play internal; production is a separate manual step (promote.yml)
  build-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    permissions:
      # Attaches the build to the release
      contents: write
      # Reads the notes comment on the merged release PR
      issues: read
      pull-requests: read
      # Downloads the release PR's build, then deletes it
      actions: write
      # Signs in to Google Cloud for Play (Workload Identity Federation)
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The release PR's CI already built this exact code (release-build.yml): reuse its AAB and APKs.
      # Anything else (code changed since, no successful run, artifact gone) builds it here instead.
      - name: Get the release PR build
        id: prebuilt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tree() { gh api "repos/$GITHUB_REPOSITORY/git/commits/$1" --jq .tree.sha; }
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" --jq '.[0].number // empty')
          head=$([ -n "$pr" ] && gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid || true)
          if [ -z "$head" ] || [ "$(tree "$sha")" != "$(tree "$head")" ]; then
            echo "::notice::$TAG isn't the code the release PR built, building it"
            exit 0
          fi
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-build.yml --commit "$head" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run" ] || ! gh run download "$run" --repo "$GITHUB_REPOSITORY" --name release-build --dir prebuilt; then
            echo "::notice::No release PR build found for $TAG, building it"
            exit 0
          fi
          # Same layout as a local build, the steps below don't need to know
          mkdir -p app/build/outputs && cp -R prebuilt/. app/build/outputs/
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq '.artifacts[] | select(.name == "release-build") | .id')
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "Reusing the build of #$pr (CI run $run)"

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.prebuilt.outputs.found != 'true'

      - uses: ./.github/actions/rclone
        id: rclone
        if: steps.prebuilt.outputs.found != 'true'

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.prebuilt.outputs.found != 'true'
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.prebuilt.outputs.found != 'true'

      - name: Decode upload keystore
        if: steps.prebuilt.outputs.found != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks

      - name: Build the rs AAB and the APKs of both flavors
        if: steps.prebuilt.outputs.found != 'true'
        env:
          KEY_ALIAS: ${{ vars.KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SKIP_RCLONE: ${{ steps.rclone.outputs.cache-hit == 'true' && '-x :rclone:buildAll' || '' }}
        # AGP 9 builds the App Bundle and the split APKs in separate runs
        run: |
          ./gradlew bundleRsRelease $SKIP_RCLONE
          ./gradlew assembleRsRelease assembleOssRelease $SKIP_RCLONE

      # The APKs go up first: they don't depend on Play (the app must exist in the Play Console for the upload below)
      - name: Upload the APKs to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/rs/release/*-universal-release.apk "starclone-${TAG}.apk"
          cp app/build/outputs/apk/oss/release/*-universal-release.apk "starclone-${TAG}-oss.apk"
          gh release upload "$TAG" "starclone-${TAG}.apk" "starclone-${TAG}-oss.apk"

      # Taken from the notes comment on the merged release PR, edits included
      - name: Write Play Store release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p whatsnew
          .github/scripts/play-notes.sh release "$TAG" > whatsnew/whatsnew-en-US
          cat whatsnew/whatsnew-en-US

      # Keyless: GitHub's OIDC token is exchanged for the Play service account (Workload Identity Federation)
      - name: Authenticate to Google Cloud
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/426278800157/locations/global/workloadIdentityPools/github/providers/kidager
          service_account: github-actions-play-store@jacem-chaieb.iam.gserviceaccount.com

      # Release notes travel with the release when it is promoted to production
      - name: Publish to Play Store
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ steps.gcp.outputs.credentials_file_path }}
          packageName: ch.jacem.starclone
          releaseFiles: app/build/outputs/bundle/rsRelease/*.aab
          tracks: internal
          whatsNewDirectory: whatsnew

      # Only once Play internal has it: promote.yml checks for the .aab
      - name: Upload the AAB to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/bundle/rsRelease/*.aab "starclone-${TAG}.aab"
          gh release upload "$TAG" "starclone-${TAG}.aab"

      - name: Delete the release PR build
        if: steps.prebuilt.outputs.artifact != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT: ${{ steps.prebuilt.outputs.artifact }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT"
