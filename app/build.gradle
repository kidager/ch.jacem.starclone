import com.android.build.api.variant.FilterConfiguration
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'kotlinx-serialization'

// Bumped by release-please (kidager-bot) on each release
def appVersion = '1.0.0' // x-release-please-version

base {
    archivesName = "starclone_v" + appVersion
}

android {
    signingConfigs {
        release {
            // CI: the upload keystore and its secrets come from the environment (release workflows);
            // locally: signing.properties at the root, if present
            def signingPropsFile = rootProject.file('signing.properties')
            def signingProps = new Properties()
            if (signingPropsFile.exists()) {
                signingProps.load(signingPropsFile.newDataInputStream())
            }
            def keystorePath = System.getenv('KEYSTORE_PATH') ?: signingProps['storeFile'] ?: 'upload-keystore.jks'
            if (file(keystorePath).exists()) {
                storeFile file(keystorePath)
                storePassword System.getenv('STORE_PASSWORD') ?: signingProps['storePassword']
                keyAlias System.getenv('KEY_ALIAS') ?: signingProps['keyAlias']
                keyPassword System.getenv('KEY_PASSWORD') ?: signingProps['keyPassword']
            }
        }
    }
    compileSdk 37
    ndkVersion project.properties['starclone.ndkVersion']
    defaultConfig {
        generatedDensities = []
        vectorDrawables.generatedDensities = []
        applicationId 'ch.jacem.starclone'
        minSdk 29
        targetSdk 36
        def (major, minor, patch) = appVersion.tokenize('.').collect { it.toInteger() }
        // Last digit is reserved for the ABI of split APKs (see versionCodes below): always ends on 0
        versionCode(Math.max(10, (major * 1000000 + minor * 1000 + patch) * 10))
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "java.lang.String", "CLI", System.getenv('RCX_BUILD_CLI') ? System.getenv('RCX_BUILD_CLI') : "\"c03129b6-b09f-9cb4-8fcd-7f143b8f94ef\""
        buildConfigField "java.lang.String", "VCP_AUTHORITY", "\"" + applicationId + ".vcp\"";

        externalNativeBuild {
            ndkBuild {
                arguments "LOCAL_LDFLAGS += -Wl,--build-id=none"
            }
        }
    }

    buildFeatures {
        viewBinding true
        compose true
        buildConfig true
        resValues true
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            manifestPlaceholders = [
                    appIcon: "@mipmap/ic_launcher_debug",
                    appIconRound: "@mipmap/ic_launcher_debug_round"
            ]
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [
                    appIcon: "@mipmap/ic_launcher",
                    appIconRound: "@mipmap/ic_launcher_round"
            ]
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        configureEach {
            jniLibs.srcDirs = ["lib"]
        }
    }

    flavorDimensions += 'edition'
    productFlavors {
        // Default GitHub and Google Play build
        rs {
            dimension 'edition'
        }
        // OSS build
        oss {
            dimension 'edition'
        }
    }

    splits {
        abi {
            // AGP 9 can't build split APKs and an App Bundle in the same run: bundles are built in their own Gradle run
            enable !gradle.startParameter.taskNames.any { it.toLowerCase().contains('bundle') }
            reset()
            include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    project.ext.versionCodes = [
        'armeabi-v7a': 6,
        'arm64-v8a'  : 7,
        'x86'        : 8,
        'x86_64'     : 9
    ]

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions {
        jniLibs {
            keepDebugSymbols += ['**/*.so']
            useLegacyPackaging true
        }
    }

    // Required for language picker
    androidResources {
        generateLocaleConfig true
    }

    buildTypes {
        getByName("debug") {
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-DEBUG"
            buildConfigField "java.lang.String", "VCP_AUTHORITY", "\"" + defaultConfig.applicationId + ".debug.vcp\"";
            resValue("string", "app_name", "StarClone Debug")
            resValue("string", "app_short_name", "StarClone Debug")
        }
    }

    lint {
        baseline = file("lint-baseline.xml")
        abortOnError = true
        warning 'MissingTranslation'

    }

    gradle.projectsEvaluated {
        preBuild.dependsOn(':rclone:buildAll')
    }

    namespace 'ch.jacem.starclone'

    // https://android.izzysoft.de/articles/named/iod-scan-apkchecks#blobs
    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def abi = output.filters.find { it.filterType == FilterConfiguration.FilterType.ABI }?.identifier
            output.versionCode.set(project.ext.versionCodes.get(abi, 0) + android.defaultConfig.versionCode)
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // Compose
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.vectordrawable:vectordrawable:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.leinardi.android:speed-dial:3.3.0'
    implementation 'org.markdownj:markdownj-core:0.4'

    implementation 'com.github.GrenderG:Toasty:1.5.2'

    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.2'

    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0")


    // Thumbnails
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.work:work-runtime-ktx:2.12.0'
    implementation 'androidx.preference:preference:1.2.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    // REST Client
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    debugImplementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    // JSON
    implementation 'com.fasterxml.jackson.core:jackson-core:2.18.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.18.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    // Timestmps
    implementation 'com.github.x0b:rfc3339parser:2.0.0'
    // SAF/WebDAV
    implementation project(':safdav')
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // Java 8+ library support (used in VirtualContentProvider and MainActivity)
    implementation 'net.sourceforge.streamsupport:android-retrostreams:1.7.4'
    implementation 'net.sourceforge.streamsupport:android-retrofuture:1.7.4'
    // App intro
    implementation 'com.github.AppIntro:AppIntro:6.3.1'
    // TEST
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'io.mockk:mockk:1.13.13'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.12.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Splash screen
    implementation("androidx.core:core-splashscreen:1.2.0-alpha02")

    // Age encryption
    implementation 'com.exceptionfactory.jagged:jagged-framework:1.0.0'
    implementation 'com.exceptionfactory.jagged:jagged-x25519:1.0.0'

    //Updates
    // rs flavor only: flagged NonFreeNet, kept out of the OSS build
    rsImplementation 'com.github.Sharkaboi:AppUpdateChecker:v1.0.5'
}
